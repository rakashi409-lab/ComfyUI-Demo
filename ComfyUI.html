<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI Demo · 工作流演示</title>
    <meta name="description" content="ComfyUI 工作流演示器：自由分组、颜色标签、JSON 导入导出、自动保存与图片恢复。无需安装模型。">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: #181818;
            color: #ccc;
            overflow: hidden;
            user-select: none;
        }

        textarea, input { user-select: text; }

        #app { display: flex; height: 100vh; flex-direction: column; }

        /* ===== 顶部菜单栏（新版 ComfyUI 风格） ===== */
        #topbar {
            height: 40px;
            background: #202020;
            border-bottom: 1px solid #0f0f0f;
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 4px;
            z-index: 200;
            flex-shrink: 0;
        }

        .tb-logo {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 10px 0 6px;
            font-size: 13px;
            font-weight: 600;
            color: #e8e8e8;
            letter-spacing: 0.2px;
        }

        .tb-logo .logo-mark {
            width: 18px; height: 18px;
            border-radius: 4px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #fff; font-weight: 700;
        }

        .tb-sep { width: 1px; height: 18px; background: #333; margin: 0 4px; }

        .tb-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #2a2a2a;
            border: 1px solid #383838;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 12px;
            color: #ddd;
            cursor: pointer;
            max-width: 260px;
        }

        .tb-tab .dot { width: 6px; height: 6px; border-radius: 50%; background: #3b82f6; flex-shrink: 0; }
        .tb-tab .close { color: #777; font-size: 13px; margin-left: 2px; }
        .tb-tab .close:hover { color: #fff; }

        .tb-btn {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px;
            color: #999;
            cursor: pointer;
            font-size: 14px;
        }

        .tb-btn:hover { background: #2e2e2e; color: #fff; }
        .tb-btn.disabled { opacity: 0.35; pointer-events: none; }

        .tb-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

        .run-button {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #2563eb;
            color: #fff;
            padding: 5px 16px;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }

        .run-button:hover { background: #1d4ed8; }
        .run-button.running { background: #374151; pointer-events: none; }

        .queue-badge {
            font-size: 11px;
            color: #888;
            background: #2a2a2a;
            border-radius: 10px;
            padding: 2px 9px;
            min-width: 24px;
            text-align: center;
        }

        /* 顶部全局执行进度条（真实 ComfyUI 在菜单栏下方有一条） */
        #global-progress {
            position: absolute;
            top: 40px; left: 0;
            width: 100%;
            height: 3px;
            background: transparent;
            z-index: 199;
            pointer-events: none;
        }

        #global-progress .gp-fill {
            height: 100%;
            width: 0%;
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
        }

        /* ===== 主体 ===== */
        #main-content { display: flex; flex: 1; overflow: hidden; }

        /* 左侧图标栏 */
        #side-rail {
            width: 44px;
            background: #1c1c1c;
            border-right: 1px solid #0f0f0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 8px;
            gap: 4px;
            flex-shrink: 0;
        }

        .rail-btn {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            color: #777;
            cursor: pointer;
        }

        .rail-btn:hover { background: #2a2a2a; color: #ddd; }
        .rail-btn.active { background: #2a2a2a; color: #3b82f6; }
        .rail-btn svg { width: 17px; height: 17px; }
        .rail-spacer { flex: 1; }

        /* 画布区域 */
        #canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #181818;
            background-image: radial-gradient(circle, #262626 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }

        #canvas {
            width: 100%; height: 100%;
            position: relative;
            touch-action: none;
        }

        #canvas-content {
            position: absolute;
            top: 0; left: 0;
            transform-origin: 0 0;
        }

        #connections-svg {
            position: absolute;
            top: 0; left: 0;
            width: 1px; height: 1px;
            overflow: visible;
            pointer-events: none;
        }

        .connection {
            fill: none;
            stroke-width: 3;
            opacity: 0.92;
            filter: drop-shadow(0 0 1px rgba(0,0,0,0.55));
        }

        .connection.temp { opacity: 0.65; }

        /* ===== 节点（LiteGraph 风格） ===== */
        .comfy-node {
            position: absolute;
            background: #353535;
            border: 1px solid #262626;
            border-radius: 8px;
            min-width: 200px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
            font-size: 12px;
            display: flex;
            flex-direction: column;
        }

        .comfy-node.selected { border-color: #e8e8e8; }

        .comfy-node.executing {
            border-color: #22c55e;
            box-shadow: 0 0 0 1px #22c55e, 0 4px 14px rgba(34, 197, 94, 0.25);
        }

        .node-header {
            position: relative;
            background: #333333;
            padding: 6px 10px;
            border-bottom: 1px solid #292929;
            border-radius: 7px 7px 0 0;
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: move;
            overflow: hidden;
        }

        .node-header .title-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            border: 1.5px solid #6b6b6b;
            flex-shrink: 0;
        }

        .node-title {
            color: #dcdcdc;
            font-size: 12.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .node-progress {
            position: absolute;
            left: 0; bottom: 0;
            height: 2px;
            width: 0%;
            background: #22c55e;
        }

        .node-body {
            padding: 6px 0 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .node-row, .widget { flex-shrink: 0; }

        /* 右下角调整大小手柄（LiteGraph 风格三角） */
        .node-resize {
            position: absolute;
            right: 0; bottom: 0;
            width: 14px; height: 14px;
            cursor: nwse-resize;
            z-index: 3;
        }

        .node-resize::after {
            content: '';
            position: absolute;
            right: 3px; bottom: 3px;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 0 8px 8px;
            border-color: transparent transparent #5a5a5a transparent;
            transition: border-color 0.12s;
        }

        .node-resize:hover::after {
            border-color: transparent transparent #999 transparent;
        }

        /* 端口行 */
        .node-row {
            display: flex;
            align-items: center;
            min-height: 21px;
            position: relative;
            padding: 0 10px;
        }

        .node-row.output { justify-content: flex-end; }

        .slot-label { color: #b0b0b0; font-size: 11.5px; }

        .node-slot {
            width: 11px; height: 11px;
            border-radius: 50%;
            border: 1.5px solid;
            background: #232323;
            cursor: crosshair;
            position: absolute;
            top: 50%;
            flex-shrink: 0;
            z-index: 2;
        }

        .node-row.input .node-slot { left: -6px; transform: translateY(-50%); }
        .node-row.output .node-slot { right: -6px; transform: translateY(-50%); }

        .node-row.input .slot-label { margin-left: 10px; }
        .node-row.output .slot-label { margin-right: 10px; }

        .node-slot:hover { transform: translateY(-50%) scale(1.25); background: currentColor; }
        .node-slot.connected { background: currentColor; }

        /* 端口类型颜色（对照真实 ComfyUI / LiteGraph 配色） */
        .type-MODEL        { border-color: #B39DDB; color: #B39DDB; }
        .type-CLIP         { border-color: #FFD500; color: #FFD500; }
        .type-VAE          { border-color: #FF6E6E; color: #FF6E6E; }
        .type-IMAGE        { border-color: #64B5F6; color: #64B5F6; }
        .type-LATENT       { border-color: #FF9CF9; color: #FF9CF9; }
        .type-CONDITIONING { border-color: #FFA931; color: #FFA931; }
        .type-MASK         { border-color: #81C784; color: #81C784; }
        .type-SAMPLER      { border-color: #ECB4B4; color: #ECB4B4; }
        .type-SIGMAS       { border-color: #CDFFCD; color: #CDFFCD; }
        .type-NOISE        { border-color: #B0B0B0; color: #B0B0B0; }
        .type-GUIDER       { border-color: #66D9EF; color: #66D9EF; }
        .type-INT          { border-color: #29699C; color: #29699C; }
        .type-STRING       { border-color: #77FF77; color: #77FF77; }
        .type-STAR         { border-color: #9ca3af; color: #9ca3af; }

        /* ===== 控件（胶囊样式，模仿 LiteGraph widget） ===== */
        .widget {
            display: flex;
            align-items: center;
            background: #222222;
            border: 1px solid #4a4a4a;
            border-radius: 10px;
            height: 21px;
            margin: 4px 10px;
            padding: 0 4px;
            font-size: 11.5px;
            cursor: pointer;
            overflow: hidden;
        }

        .widget:hover { border-color: #6a6a6a; }

        .w-arrow {
            color: #888;
            width: 14px;
            text-align: center;
            font-size: 10px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.12s;
        }

        .widget:hover .w-arrow { opacity: 1; }
        .w-arrow:hover { color: #fff; }

        .w-name {
            color: #999;
            margin: 0 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .w-val {
            color: #ddd;
            flex: 1;
            text-align: right;
            margin-right: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .w-val input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 11.5px;
            text-align: right;
            font-family: inherit;
        }

        .widget.w-btn {
            justify-content: center;
            color: #bbb;
        }

        .widget.w-btn:hover { background: #2b2b2b; color: #fff; }

        /* 多行文本 */
        .widget-text {
            display: block;
            width: calc(100% - 20px);
            margin: 4px 10px;
            background: #222;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            color: #ddd;
            padding: 5px 7px;
            font-size: 11.5px;
            font-family: inherit;
            resize: none;
            min-height: 64px;
            flex: 1;
        }

        .widget-text:focus { outline: none; border-color: #6a6a6a; }

        /* 图片预览（LoadImage） */
        .image-preview {
            margin: 4px 10px 2px;
            min-height: 110px;
            background: #262626;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            flex: 1;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            -webkit-user-drag: none;
        }

        .image-placeholder { color: #5c5c5c; font-size: 11px; }

        /* ===== 节点搜索面板 ===== */
        #search-modal {
            position: fixed;
            background: #202020;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            box-shadow: 0 14px 44px rgba(0, 0, 0, 0.75);
            width: 460px;
            max-height: 560px;
            display: none;
            z-index: 10000;
            overflow: hidden;
        }

        #search-modal.active { display: flex; flex-direction: column; }

        #search-input {
            width: 100%;
            padding: 11px 14px;
            background: #191919;
            border: none;
            border-bottom: 1px solid #333;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
        }

        #search-input:focus { outline: none; }

        #search-results { flex: 1; overflow-y: auto; max-height: 490px; padding: 4px 0; }

        .category-title {
            padding: 7px 14px 3px;
            color: #6d6d6d;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .result-item {
            padding: 6px 14px;
            cursor: pointer;
            font-size: 12.5px;
            color: #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .result-item .r-type {
            color: #666;
            font-size: 10.5px;
            font-family: Consolas, monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-item:hover, .result-item.selected { background: #2f4f88; color: #fff; }
        .result-item:hover .r-type, .result-item.selected .r-type { color: #b9c8e8; }

        /* 下拉选项菜单 */
        #combo-menu {
            position: fixed;
            background: #202020;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            min-width: 140px;
            max-height: 320px;
            overflow-y: auto;
            display: none;
            z-index: 10001;
            padding: 3px 0;
        }

        #combo-menu.active { display: block; }

        .combo-item {
            padding: 5px 14px;
            font-size: 12px;
            color: #ccc;
            cursor: pointer;
            white-space: nowrap;
        }

        .combo-item:hover { background: #2f4f88; color: #fff; }
        .combo-item.current { color: #3b82f6; }
        .combo-item.current:hover { color: #fff; }

        /* ===== 画布左下角缩放控件 ===== */
        #zoom-controls {
            position: absolute;
            left: 12px; bottom: 12px;
            display: flex;
            align-items: center;
            background: rgba(32, 32, 32, 0.92);
            border: 1px solid #333;
            border-radius: 6px;
            overflow: hidden;
            z-index: 50;
        }

        .zoom-btn {
            width: 28px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            color: #999;
            cursor: pointer;
            font-size: 13px;
        }

        .zoom-btn:hover { background: #2e2e2e; color: #fff; }

        #zoom-display {
            min-width: 46px;
            text-align: center;
            font-size: 11px;
            color: #aaa;
            cursor: pointer;
        }

        #zoom-display:hover { color: #fff; }

        /* ===== 生成历史（队列图标弹出面板） ===== */
        #gen-history-panel {
            position: fixed;
            left: 52px;
            bottom: 12px;
            width: 280px;
            max-height: 70vh;
            background: #202020;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            box-shadow: 0 14px 44px rgba(0, 0, 0, 0.75);
            display: none;
            flex-direction: column;
            z-index: 9999;
            overflow: hidden;
        }

        #gen-history-panel.active { display: flex; }

        .gh-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 13px;
            background: #262626;
            border-bottom: 1px solid #333;
            font-size: 12.5px;
            color: #ddd;
            font-weight: 500;
        }

        .gh-close { color: #888; cursor: pointer; font-size: 15px; }
        .gh-close:hover { color: #fff; }

        .gh-body { padding: 10px; overflow-y: auto; flex: 1; }

        .gh-upload {
            border: 1.5px dashed #444;
            border-radius: 6px;
            padding: 16px 10px;
            text-align: center;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .gh-upload:hover, .gh-upload.dragover { border-color: #3b82f6; color: #bbb; background: #24282f; }

        .gh-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }

        .gh-item {
            display: flex;
            align-items: center;
            gap: 9px;
            background: #262626;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px;
        }

        .gh-item.used { opacity: 0.45; }

        .gh-item.next { border-color: #3b82f6; }

        .gh-item img {
            width: 52px; height: 52px;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .gh-item .gh-info { flex: 1; min-width: 0; }

        .gh-item .gh-idx { font-size: 11.5px; color: #ccc; }
        .gh-item .gh-tag { font-size: 10px; color: #666; margin-top: 2px; }
        .gh-item.next .gh-tag { color: #3b82f6; }

        .gh-item .gh-del {
            color: #666; cursor: pointer; font-size: 14px;
            padding: 2px 6px; flex-shrink: 0;
        }
        .gh-item .gh-del:hover { color: #ff6b6b; }

        .gh-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 13px;
            border-top: 1px solid #333;
            font-size: 11px;
            color: #888;
        }

        .gh-reset { color: #3b82f6; cursor: pointer; }
        .gh-reset:hover { text-decoration: underline; }

        /* ===== 节点库面板 ===== */
        #node-lib-panel {
            position: fixed;
            left: 52px;
            top: 48px;
            bottom: 12px;
            width: 270px;
            background: #202020;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            box-shadow: 0 14px 44px rgba(0, 0, 0, 0.75);
            display: none;
            flex-direction: column;
            z-index: 9998;
            overflow: hidden;
        }

        #node-lib-panel.active { display: flex; }

        .nl-load-wf {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 10px 0;
            padding: 8px 12px;
            background: #2563eb;
            color: #fff;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .nl-load-wf:hover { background: #1d4ed8; }

        #nl-search {
            margin: 10px;
            padding: 7px 11px;
            background: #191919;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            font-family: inherit;
            flex-shrink: 0;
        }

        #nl-search:focus { outline: none; border-color: #4a4a4a; }

        .nl-body { flex: 1; overflow-y: auto; padding: 0 4px 8px; }

        .nl-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 12px;
            margin: 1px 6px;
            border-radius: 5px;
            font-size: 12.5px;
            color: #ddd;
            cursor: grab;
        }

        .nl-item:hover { background: #2e2e2e; }
        .nl-item:active { cursor: grabbing; }

        .nl-item .r-type {
            color: #666;
            font-size: 10px;
            font-family: Consolas, monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }

        /* 提示 toast */        #toast {
            position: fixed;
            left: 50%;
            bottom: 34px;
            transform: translateX(-50%) translateY(20px);
            background: #202020;
            border: 1px solid #3c3c3c;
            border-left: 3px solid #22c55e;
            color: #ddd;
            font-size: 12.5px;
            padding: 9px 18px;
            border-radius: 6px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 10002;
        }

        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }

/* Editable ComfyUI-style group backdrops; nodes remain above the groups. */
button, input, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, [role=button]:focus-visible { outline: 2px solid #60a5fa; outline-offset: 3px; }
.tool { background:#292929; border:1px solid #414141; color:#ddd; border-radius:5px; padding:5px 9px; font-size:12px; white-space:nowrap; }
.tool:hover { background:#393939; }
.tool.primary { background:#2563eb; border-color:#3b82f6; color:white; }
.tool.danger { color:#fca5a5; }
.tool:disabled { opacity:.45; cursor:default; }
#topbar { height:auto; min-height:44px; flex-wrap:wrap; padding:5px 8px; gap:6px; }
#global-progress { position:relative; top:auto; height:3px; flex-shrink:0; }
.tb-tab { max-width:200px; }
#workflow-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#save-status { font-size:11px; color:#9ca3af; max-width:220px; }
#canvas-content { isolation:isolate; }
#connections-svg { z-index:2; }
.comfy-node { z-index:10; }
.comfy-group { position:absolute; z-index:0; border:1.5px solid var(--group-color); background:var(--group-fill); pointer-events:none; min-width:120px; min-height:80px; }
.comfy-group.selected { outline:2px solid var(--group-color); outline-offset:3px; }
.group-header { position:absolute; left:-1px; right:-1px; top:-1px; height:36px; background:var(--group-head); color:#f5f5f5; display:flex; align-items:center; padding:0 10px; gap:8px; pointer-events:auto; cursor:move; }
.group-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 2px #0009; }
.group-header { height:var(--group-header-height,36px); }
.group-edit { color:inherit; background:#0003; border:0; border-radius:3px; font-size:16px; width:25px; height:24px; }
.group-resize { position:absolute; pointer-events:auto; width:18px; height:18px; right:0; bottom:0; cursor:nwse-resize; background:linear-gradient(135deg,transparent 55%,var(--group-color) 56%); }
.group-resize.e { right:-5px; top:36px; bottom:18px; height:auto; width:10px; cursor:ew-resize; background:none; }
.group-resize.s { bottom:-5px; left:0; right:18px; width:auto; height:10px; cursor:ns-resize; background:none; }
#group-inspector { display:none; position:absolute; right:16px; top:16px; width:258px; max-height:calc(100% - 32px); overflow:auto; z-index:150; background:#222; border:1px solid #484848; border-radius:8px; box-shadow:0 12px 32px #0007; padding:14px; font-size:13px; }
#group-inspector.active { display:block; }
.panel-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-weight:600; font-size:14px; }
.field { display:flex; flex-direction:column; gap:6px; margin:12px 0; }
.field input:not([type=checkbox]):not([type=range]):not([type=color]), .field select { width:100%; background:#181818; border:1px solid #484848; border-radius:4px; padding:7px; color:#eee; }
.field input:focus { outline:1px solid #60a5fa; }
.field input[type=color] { width:45px; height:32px; background:transparent; border:0; padding:0; flex-shrink:0; }
.field input[type=range] { width:100%; accent-color:#60a5fa; }
.two-fields { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.inline-fields { display:flex; align-items:center; gap:8px; }
.field small, .hint { color:#aaa; font-size:12px; line-height:1.6; }
.swatches { display:flex; gap:8px; }
.swatches button { width:25px; height:25px; border:1px solid #ffffff55; border-radius:50%; background:var(--swatch); }
.save-download { display:block; width:calc(100% - 16px); margin:8px; }
#editor-dialog { width:min(580px,calc(100vw - 32px)); max-height:80vh; overflow:auto; background:#242424; color:#ddd; border:1px solid #555; border-radius:10px; padding:22px; margin:auto; box-shadow:0 20px 80px #0008; font-size:14px; }
#editor-dialog::backdrop { background:#0008; }
#dialog-body { line-height:1.65; }
#dialog-body ul { padding-left:20px; }
.gallery { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.gallery figure { margin:0; }
.gallery img { max-width:100%; max-height:230px; display:block; object-fit:contain; background:#181818; }
.log-entry { padding:8px 0; border-bottom:1px solid #3b3b3b; overflow-wrap:anywhere; }
.log-entry time { color:#999; margin-right:8px; }
#app.is-running .comfy-node, #app.is-running .comfy-group { pointer-events:none; }
#app.is-running .group-header, #app.is-running .group-resize { pointer-events:none; }
body.is-loading #app { pointer-events:none; opacity:.65; }
#run-button { border:0; }
.run-button.running { pointer-events:auto; background:#9b3535; }
.gh-upload { font-size:13px; }
.image-preview img { width:auto; max-width:100%; }
@media(max-width:800px) { .tb-logo { display:none; } #save-status { max-width:140px; } #group-inspector { width:230px; right:8px; } #gen-history-panel, #node-lib-panel { max-width:calc(100vw - 64px); } .tb-right { margin-left:0; } }
</style>
</head>
<body>

                </div>
                <div class="rail-btn" title="模型库" onclick="app.showModels()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>
                </div>
                <div class="rail-btn" title="图像" onclick="app.showGallery()">

                    </div>
                </div>

                <aside id="group-inspector" aria-label="分组设置">

                    <label class="field">标签名称<input id="group-title" maxlength="200"></label>
                    <label class="field">颜色<div class="inline-fields"><input id="group-color" type="color" aria-label="选择分组颜色"><input id="group-hex" aria-label="分组颜色 HEX" placeholder="#256b89" maxlength="7"></div></label>

                </aside>

    </div>

    <!-- 节点搜索 -->

        <input type="text" id="search-input" placeholder="搜索节点..." autocomplete="off" spellcheck="false">
        <div id="search-results"></div>
    </div>

    <!-- 下拉菜单 -->

            <span>生成历史</span>
            <span class="gh-close" onclick="app.toggleGenHistory()">×</span>
        </div>
        <div class="gh-body">
            <div class="gh-upload" id="gh-upload">

            _zTop: 10,
            genImages: [],      // 生成历史：预上传的成品图（dataURL 列表）
            genCursor: 0,       // 下一次"生成"要展示第几张

            init() {
                this.canvas = document.getElementById('canvas');
                this.canvasArea = document.getElementById('canvas-area');
                this.canvasContent = document.getElementById('canvas-content');
                this.svg = document.getElementById('connections-svg');

                this.setupEvents();
                this.setupGenHistory();
                this.setupNodeLib();
                this.updateTransform();
                this.commit(); // 记录初始空状态，保证第一步操作可撤销
            },

            // 屏幕坐标 → 世界坐标
            toWorld(clientX, clientY) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: (clientX - rect.left - this.transform.x) / this.transform.scale,
                    y: (clientY - rect.top - this.transform.y) / this.transform.scale
                };
            },

            setupEvents() {
                // 双击空白画布 → 节点搜索
                this.canvas.addEventListener('dblclick', (e) => {
                    if (this.isCanvasTarget(e.target)) {
                        this.searchPos = this.toWorld(e.clientX, e.clientY);
                        this.showSearch(e.clientX, e.clientY);
                    }
                });

                // 右键空白画布 → 节点搜索（模仿真实 ComfyUI 的添加节点菜单）
                this.canvasArea.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if (this.isCanvasTarget(e.target)) {
                        this.searchPos = this.toWorld(e.clientX, e.clientY);
                        this.showSearch(e.clientX, e.clientY);
                    }
                });

                // 画布平移（左键拖空白处；中键在任意位置包括节点上都可平移）
                this.canvas.addEventListener('mousedown', (e) => {
                    const blankTarget = this.isCanvasTarget(e.target);
                    if (e.button === 1 || (e.button === 0 && blankTarget)) {
                        this.isPanning = true;
                        this.panStart = { x: e.clientX - this.transform.x, y: e.clientY - this.transform.y };
                        if (blankTarget) this.selectNode(null);
                        e.preventDefault();
                    }
                });

                document.addEventListener('mousemove', (e) => {
                    if (this.isPanning) {
                        this.transform.x = e.clientX - this.panStart.x;
                        this.transform.y = e.clientY - this.panStart.y;
                        this.updateTransform();
                    }
                    if (this.linking) {
                        this.linkMouse = this.toWorld(e.clientX, e.clientY);
                        this.renderConnections();
                    }
                });

                document.addEventListener('mouseup', () => {
                    this.isPanning = false;
                    if (this.linking) {
                        // 拖线落空：若是断开的旧连接则记录历史
                        const wasDetach = this.linking.detached;
                        this.linking = null;
                        this.linkMouse = null;
                        this.updateSlotStates();
                        this.renderConnections();
                        if (wasDetach) this.commit();
                    }
                });

                // 滚轮缩放
                this.canvasArea.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
                    this.zoomAt(factor, e.clientX, e.clientY);
                }, { passive: false });

                // 搜索框
                const input = document.getElementById('search-input');
                input.addEventListener('input', (e) => this.renderSearch(e.target.value));
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') { this.hideSearch(); }
                    else if (e.key === 'Enter') {
                        const sel = document.querySelector('.result-item.selected');
                        if (sel) sel.click();
                    } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.navigateSearch(e.key === 'ArrowDown' ? 1 : -1);
                    }
                });

                document.addEventListener('mousedown', (e) => {
                    const modal = document.getElementById('search-modal');
                    if (modal.classList.contains('active') && !modal.contains(e.target)) this.hideSearch();
                    const menu = document.getElementById('combo-menu');
                    if (menu.classList.contains('active') && !menu.contains(e.target)) this.closeComboMenu();
                });

            },

            isCanvasTarget(t) {
                return t === this.canvas || t === this.svg || t === this.canvasContent || t === this.canvasArea;
            },

            // ===================== 视图变换 =====================
            updateTransform() {
                const { x, y, scale } = this.transform;
                // 只在容器上做一次变换，节点不再单独缩放（修复双重缩放导致的连线偏移）
                this.canvasContent.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
                // 网格跟随平移缩放
                this.canvasArea.style.backgroundPosition = `${x}px ${y}px`;
                this.canvasArea.style.backgroundSize = `${24 * scale}px ${24 * scale}px`;
                this.updateZoomDisplay();
            },

            zoomAt(factor, clientX, clientY) {
                const newScale = Math.max(0.1, Math.min(4, this.transform.scale * factor));
                const rect = this.canvas.getBoundingClientRect();
                const mx = clientX - rect.left;
                const my = clientY - rect.top;
                this.transform.x = mx - (mx - this.transform.x) * (newScale / this.transform.scale);
                this.transform.y = my - (my - this.transform.y) * (newScale / this.transform.scale);
                this.transform.scale = newScale;
                this.updateTransform();
            },

            zoomStep(factor) {
                const rect = this.canvas.getBoundingClientRect();
                this.zoomAt(factor, rect.left + rect.width / 2, rect.top + rect.height / 2);
            },

            updateZoomDisplay() {
                document.getElementById('zoom-display').textContent = Math.round(this.transform.scale * 100) + '%';
            },

            resetView() {
                this.transform = { x: 150, y: 90, scale: 1 };
                this.updateTransform();
            },

            fitView() {
                if (this.nodes.length === 0) { this.resetView(); return; }
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                this.nodes.forEach(n => {
                    const el = this.nodeEl(n.id);
                    const w = el ? el.offsetWidth : 200;
                    const h = el ? el.offsetHeight : 100;
                    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
                    maxX = Math.max(maxX, n.x + w); maxY = Math.max(maxY, n.y + h);
                });
                const rect = this.canvas.getBoundingClientRect();
                const pad = 60;
                const scale = Math.max(0.1, Math.min(1.5,
                    Math.min((rect.width - pad * 2) / (maxX - minX), (rect.height - pad * 2) / (maxY - minY))));
                this.transform.scale = scale;
                this.transform.x = (rect.width - (maxX - minX) * scale) / 2 - minX * scale;
                this.transform.y = (rect.height - (maxY - minY) * scale) / 2 - minY * scale;
                this.updateTransform();
            },

            // ===================== 节点搜索 =====================
            showSearch(x, y) {
                const modal = document.getElementById('search-modal');
                const input = document.getElementById('search-input');
                modal.classList.add('active');
                // 防止超出屏幕
                const mw = modal.offsetWidth, mh = Math.min(modal.offsetHeight, 560);
                modal.style.left = Math.min(x, window.innerWidth - mw - 16) + 'px';
                modal.style.top = Math.min(y, window.innerHeight - mh - 16) + 'px';
                input.value = '';
                this.renderSearch('');
                setTimeout(() => input.focus(), 0);
            },

            hideSearch() {
                document.getElementById('search-modal').classList.remove('active');
            },

            renderSearch(filter) {
                const results = document.getElementById('search-results');
                const f = (filter || '').toLowerCase();
                let html = '';
                let first = true;

                Object.keys(CATEGORIES).forEach(cat => {
                    const list = Object.entries(NODES)
                        .filter(([type, def]) => def.category === cat)
                        .filter(([type, def]) => !f ||
                            def.title.toLowerCase().includes(f) || type.toLowerCase().includes(f));
                    if (list.length === 0) return;

                    html += `<div class="category-title">${CATEGORIES[cat]}</div>`;
                    list.forEach(([type, def]) => {
                        html += `<div class="result-item ${first ? 'selected' : ''}" data-type="${esc(type)}">
                            <span>${esc(def.title)}</span><span class="r-type">${esc(type)}</span></div>`;
                        first = false;
                    });
                });

                results.innerHTML = html || '<div style="padding:16px;color:#666;font-size:12px;text-align:center;">未找到节点</div>';

                results.querySelectorAll('.result-item').forEach(item => {
                    item.addEventListener('click', () => {
                        this.addNode(item.dataset.type, this.searchPos.x, this.searchPos.y);
                        this.hideSearch();
                    });
                    item.addEventListener('mouseenter', () => {
                        results.querySelectorAll('.result-item').forEach(i => i.classList.remove('selected'));
                        item.classList.add('selected');
                    });
                });
            },

            navigateSearch(dir) {
                const items = Array.from(document.querySelectorAll('.result-item'));
                if (!items.length) return;
                const idx = items.findIndex(i => i.classList.contains('selected'));
                let ni = idx + dir;
                if (ni < 0) ni = items.length - 1;
                if (ni >= items.length) ni = 0;
                items.forEach(i => i.classList.remove('selected'));
                items[ni].classList.add('selected');
                items[ni].scrollIntoView({ block: 'nearest' });
            },

            // ===================== 节点管理 =====================
            addNode(type, x, y) {
                const def = NODES[type];
                if (!def) return;
                const node = {
                    id: this.nextId++,
                    type, x, y,
                    w: def.width || 0,   // 0 = 自动宽度
                    h: 0,                // 0 = 自动高度
                    inputs: def.inputs.map(i => ({ ...i })),
                    outputs: def.outputs.map(o => ({ ...o })),
                    widgets: def.widgets.map(w => ({ ...w }))
                };
                this.nodes.push(node);
                this.renderNode(node);
                this.renderConnections();
                this.commit();
            },

            deleteNode(nodeId) {
                const idx = this.nodes.findIndex(n => n.id === nodeId);
                if (idx === -1) return;
                this.nodes.splice(idx, 1);
                this.connections = this.connections.filter(c => c.fromNode !== nodeId && c.toNode !== nodeId);
                const el = this.nodeEl(nodeId);
                if (el) el.remove();
                if (this.selectedNode && this.selectedNode.id === nodeId) this.selectedNode = null;
                this.updateSlotStates();
                this.renderConnections();
                this.commit();
            },

            nodeEl(id) {
                return this.canvasContent.querySelector(`[data-node-id="${id}"]`);
            },

            selectNode(node) {
                this.selectedNode = node;
                this.canvasContent.querySelectorAll('.comfy-node').forEach(el => {
                    el.classList.toggle('selected', !!node && parseInt(el.dataset.nodeId) === node.id);
                });
            },

            // ===================== 节点渲染 =====================
            renderNode(node) {
                const def = NODES[node.type] || {};
                const el = document.createElement('div');
                el.className = 'comfy-node';
                el.dataset.nodeId = node.id;
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
                if (node.w) el.style.width = node.w + 'px';
                else if (def.width) el.style.width = def.width + 'px';
                if (node.h) el.style.height = node.h + 'px';

                let html = `
                    <div class="node-header">
                        <span class="title-dot"></span>
                        <span class="node-title">${esc(def.title || node.type)}</span>
                        <div class="node-progress"></div>
                    </div>
                    <div class="node-body">`;

                // 输入端口
                node.inputs.forEach((inp, i) => {
                    const tc = `type-${inp.type === '*' ? 'STAR' : inp.type}`;
                    html += `<div class="node-row input">
                        <div class="node-slot ${tc}" data-node="${node.id}" data-kind="input" data-idx="${i}" data-dtype="${esc(inp.type)}"></div>
                        <span class="slot-label">${esc(inp.label)}</span>
                    </div>`;
                });

                // 输出端口
                node.outputs.forEach((out, i) => {
                    const tc = `type-${out.type === '*' ? 'STAR' : out.type}`;
                    html += `<div class="node-row output">
                        <span class="slot-label">${esc(out.label)}</span>
                        <div class="node-slot ${tc}" data-node="${node.id}" data-kind="output" data-idx="${i}" data-dtype="${esc(out.type)}"></div>
                    </div>`;
                });

                // 控件
                node.widgets.forEach((w, i) => {
                    html += this.widgetHTML(w, i);
                });

                // 生成结果展示区（SaveImage 执行后显示）
                if (node.resultImage) {
                    html += `<div class="image-preview save-result"><img src="${node.resultImage}" alt=""></div>`;
                }

                html += `</div><div class="node-resize" title="拖动调整大小"></div>`;
                el.innerHTML = html;
                this.canvasContent.appendChild(el);
                this.setupNodeEvents(el, node);
            },

            fmtNumber(w) {
                const v = Number(w.value) || 0;
                if (w.step && w.step < 1) return v.toFixed(1);
                return String(Math.round(v));
            },

            widgetHTML(w, i) {
                if (w.type === 'combo') {
                    return `<div class="widget w-combo" data-widget="${i}">
                        <span class="w-arrow" data-dir="-1">◂</span>
                        <span class="w-name">${esc(w.label)}</span>
                        <span class="w-val">${esc(w.value)}</span>
                        <span class="w-arrow" data-dir="1">▸</span>
                    </div>`;
                }
                if (w.type === 'number') {
                    return `<div class="widget w-number" data-widget="${i}">
                        <span class="w-arrow" data-dir="-1">◂</span>
                        <span class="w-name">${esc(w.label)}</span>
                        <span class="w-val">${esc(this.fmtNumber(w))}</span>
                        <span class="w-arrow" data-dir="1">▸</span>
                    </div>`;
                }
                if (w.type === 'string') {
                    return `<div class="widget w-string" data-widget="${i}">
                        <span class="w-name">${esc(w.label)}</span>
                        <span class="w-val">${esc(w.value)}</span>
                    </div>`;
                }
                if (w.type === 'text') {
                    return `<textarea class="widget-text" data-widget="${i}" rows="4" placeholder="文本提示词" spellcheck="false">${esc(w.value)}</textarea>`;
                }
                if (w.type === 'image') {
                    return `<div class="widget w-combo w-image-name" data-widget="${i}">
                            <span class="w-name">image</span>
                            <span class="w-val">${esc(w.filename || '未选择')}</span>
                        </div>
                        <div class="widget w-btn w-upload" data-widget="${i}">选择文件上传</div>
                        <div class="image-preview" data-widget="${i}">${
                            w.value && w.value.startsWith('data:')
                                ? `<img src="${w.value}" alt="">`
                                : `<div class="image-placeholder">暂无图像</div>`
                        }</div>
                        <input type="file" class="image-upload-input" data-widget="${i}" accept="image/*" style="display:none;">`;
                }
                return '';
            },

            // ===================== 节点交互 =====================
            setupNodeEvents(el, node) {
                // 选中 + 拖动（从头部或空白区域拖动，控件区域除外）
                el.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    this.selectNode(node);
                    // 提到最上层（用 z-index，避免重插 DOM 打断子元素的 click 事件）
                    el.style.zIndex = ++this._zTop;

                    if (e.target.closest('.node-slot, .node-resize, .widget, .widget-text, .image-preview, input, textarea')) return;

                    e.preventDefault();
                    e.stopPropagation();

                    const start = this.toWorld(e.clientX, e.clientY);
                    const offX = start.x - node.x;
                    const offY = start.y - node.y;
                    let moved = false;

                    const onMove = (ev) => {
                        const p = this.toWorld(ev.clientX, ev.clientY);
                        node.x = p.x - offX;
                        node.y = p.y - offY;
                        el.style.left = node.x + 'px';
                        el.style.top = node.y + 'px';
                        moved = true;
                        this.renderConnections();
                    };
                    const onUp = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        if (moved) this.commit();
                    };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });

                // 右下角拖拽调整大小
                const resizeHandle = el.querySelector('.node-resize');
                resizeHandle.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    e.preventDefault();
                    e.stopPropagation();
                    this.selectNode(node);

                    const start = this.toWorld(e.clientX, e.clientY);
                    const startW = el.offsetWidth;
                    const startH = el.offsetHeight;
                    // 最小尺寸 = 内容自然尺寸（不能缩到内容被裁掉）
                    const prevW = el.style.width, prevH = el.style.height;
                    el.style.width = '';
                    el.style.height = '';
                    const minW = Math.max(140, el.offsetWidth);
                    const minH = Math.max(60, el.offsetHeight);
                    el.style.width = prevW;
                    el.style.height = prevH;
                    let resized = false;

                    const onMove = (ev) => {
                        const p = this.toWorld(ev.clientX, ev.clientY);
                        node.w = Math.max(minW, Math.round(startW + (p.x - start.x)));
                        node.h = Math.max(minH, Math.round(startH + (p.y - start.y)));
                        el.style.width = node.w + 'px';
                        el.style.height = node.h + 'px';
                        resized = true;
                        this.renderConnections();
                    };
                    const onUp = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        if (resized) this.commit();
                    };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });

                // 端口连线
                el.querySelectorAll('.node-slot').forEach(slot => {
                    slot.addEventListener('mousedown', (e) => {
                        if (e.button !== 0) return; // 中键交给画布平移
                        e.stopPropagation();
                        e.preventDefault();
                        const nodeId = parseInt(slot.dataset.node);
                        const kind = slot.dataset.kind;
                        const idx = parseInt(slot.dataset.idx);
                        const dtype = slot.dataset.dtype;

                        if (kind === 'output') {
                            this.linking = { nodeId, idx, dtype, detached: false };
                        } else {
                            // 从已连接的输入端拖动 = 断开并接管这根线（真实 ComfyUI 行为）
                            const existing = this.connections.find(c => c.toNode === nodeId && c.toSlot === idx);
                            if (existing) {
                                this.connections = this.connections.filter(c => c !== existing);
                                this.linking = { nodeId: existing.fromNode, idx: existing.fromSlot, dtype: existing.type, detached: true };
                                this.updateSlotStates();
                                this.renderConnections();
                            }
                        }
                        this.linkMouse = this.toWorld(e.clientX, e.clientY);
                    });

                    slot.addEventListener('mouseup', (e) => {
                        if (!this.linking) return;
                        e.stopPropagation();
                        e.preventDefault();

                        const nodeId = parseInt(slot.dataset.node);
                        const kind = slot.dataset.kind;
                        const idx = parseInt(slot.dataset.idx);
                        const dtype = slot.dataset.dtype;

                        if (kind === 'input' && nodeId !== this.linking.nodeId &&
                            this.canConnect(this.linking.dtype, dtype)) {
                            // 输入端只允许一根线
                            this.connections = this.connections.filter(c => !(c.toNode === nodeId && c.toSlot === idx));
                            this.connections.push({
                                fromNode: this.linking.nodeId,
                                fromSlot: this.linking.idx,
                                toNode: nodeId,
                                toSlot: idx,
                                type: this.linking.dtype
                            });
                            this.linking = null;
                            this.linkMouse = null;
                            this.updateSlotStates();
                            this.renderConnections();
                            this.commit();
                        }
                    });
                });

                this.bindWidgets(el, node);
                this.updateSlotStates();
            },

            canConnect(from, to) {
                return from === '*' || to === '*' || from === to;
            },

            // ===================== 控件交互 =====================
            bindWidgets(el, node) {
                // combo：左右箭头切换 + 点击弹出选项
                el.querySelectorAll('.w-combo:not(.w-image-name)').forEach(wEl => {
                    const idx = parseInt(wEl.dataset.widget);
                    const w = node.widgets[idx];
                    if (!w || !w.options) return;
                    const valEl = wEl.querySelector('.w-val');

                    wEl.querySelectorAll('.w-arrow').forEach(a => {
                        a.addEventListener('mousedown', e => { if (e.button === 0) e.stopPropagation(); });
                        a.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const dir = parseInt(a.dataset.dir);
                            let ci = w.options.indexOf(w.value) + dir;
                            if (ci < 0) ci = w.options.length - 1;
                            if (ci >= w.options.length) ci = 0;
                            w.value = w.options[ci];
                            valEl.textContent = w.value;
                            this.commit();
                        });
                    });

                    wEl.addEventListener('click', (e) => {
                        if (e.target.classList.contains('w-arrow')) return;
                        e.stopPropagation();
                        this.openComboMenu(wEl, w.options, w.value, (v) => {
                            w.value = v;
                            valEl.textContent = v;
                            this.commit();
                        });
                    });
                });

                // number：箭头增减 + 点击输入
                el.querySelectorAll('.w-number').forEach(wEl => {
                    const idx = parseInt(wEl.dataset.widget);
                    const w = node.widgets[idx];
                    if (!w) return;
                    const valEl = wEl.querySelector('.w-val');
                    const step = w.step || 1;

                    wEl.querySelectorAll('.w-arrow').forEach(a => {
                        a.addEventListener('mousedown', e => { if (e.button === 0) e.stopPropagation(); });
                        a.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const dir = parseInt(a.dataset.dir);
                            w.value = this.normalizeNumber(node.type, w, Number(w.value) + dir * step);
                            if (step < 1) w.value = Number(w.value.toFixed(4));
                            valEl.textContent = this.fmtNumber(w);
                            this.commit();
                        });
                    });

                    wEl.addEventListener('click', (e) => {
                        if (e.target.classList.contains('w-arrow') || valEl.querySelector('input')) return;
                        e.stopPropagation();
                        this.inlineEdit(valEl, String(w.value), (v) => {
                            const num = parseFloat(v);
                            w.value = this.normalizeNumber(node.type, w, num);
                            valEl.textContent = this.fmtNumber(w);
                            this.commit();
                        });
                    });
                });

                // string：点击输入
                el.querySelectorAll('.w-string').forEach(wEl => {
                    const idx = parseInt(wEl.dataset.widget);
                    const w = node.widgets[idx];
                    if (!w) return;
                    const valEl = wEl.querySelector('.w-val');
                    wEl.addEventListener('click', (e) => {
                        if (valEl.querySelector('input')) return;
                        e.stopPropagation();
                        this.inlineEdit(valEl, w.value, (v) => {
                            w.value = v;
                            valEl.textContent = v;
                            this.commit();
                        });
                    });
                });

                // 多行文本：实时存值，失焦记录历史
                el.querySelectorAll('.widget-text').forEach(ta => {
                    const idx = parseInt(ta.dataset.widget);
                    const w = node.widgets[idx];
                    if (!w) return;
                    ta.addEventListener('mousedown', e => { if (e.button === 0) e.stopPropagation(); });
                    ta.addEventListener('input', () => { w.value = ta.value; this.scheduleSave(); });
                    ta.addEventListener('change', () => this.commit());
                });

                // 图片上传
                const fileInput = el.querySelector('.image-upload-input');
                if (fileInput) {
                    const idx = parseInt(fileInput.dataset.widget);
                    const w = node.widgets[idx];
                    const preview = el.querySelector('.image-preview');
                    const nameVal = el.querySelector('.w-image-name .w-val');
                    const trigger = () => fileInput.click();

                    el.querySelector('.w-upload').addEventListener('click', (e) => { e.stopPropagation(); trigger(); });
                    preview.addEventListener('click', (e) => { e.stopPropagation(); trigger(); });

                    fileInput.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (!file || this.isRunning) return;
                        try {
                            const image = await this.readImage(file);
                            if (!this.nodes.includes(node)) return;
                            w.value = image;
                            w.filename = file.name;
                            preview.innerHTML = `<img src="${image}" alt="">`;
                            preview.querySelector('img').onload = () => this.renderConnections();
                            if (nameVal) nameVal.textContent = file.name;
                            this.commit();
                        } catch (error) { this.toast(error.message); }
                        fileInput.value = '';
                    });
                }
            },

            inlineEdit(valEl, current, onCommit) {
                const old = current;
                valEl.innerHTML = `<input type="text" value="${esc(current)}" spellcheck="false">`;
                const input = valEl.querySelector('input');
                input.focus();
                input.select();
                input.addEventListener('mousedown', e => { if (e.button === 0) e.stopPropagation(); });
                input.addEventListener('click', e => e.stopPropagation());

                let done = false;
                const finish = (commit) => {
                    if (done) return;
                    done = true;
                    const v = input.value;
                    if (commit) onCommit(v);
                    else valEl.textContent = old;
                };
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { finish(true); }
                    if (e.key === 'Escape') { finish(false); }
                    e.stopPropagation();
                });
                input.addEventListener('blur', () => finish(true));
            },

            openComboMenu(anchorEl, options, current, onPick) {
                const menu = document.getElementById('combo-menu');
                menu.innerHTML = options.map(o =>
                    `<div class="combo-item ${o === current ? 'current' : ''}">${esc(o)}</div>`).join('');
                menu.classList.add('active');

                const rect = anchorEl.getBoundingClientRect();
                menu.style.left = Math.min(rect.left, window.innerWidth - menu.offsetWidth - 12) + 'px';
                menu.style.top = Math.min(rect.bottom + 3, window.innerHeight - menu.offsetHeight - 12) + 'px';

                menu.querySelectorAll('.combo-item').forEach((item, i) => {
                    item.addEventListener('click', () => {
                        onPick(options[i]);
                        this.closeComboMenu();
                    });
                });
            },

            closeComboMenu() {
                document.getElementById('combo-menu').classList.remove('active');
            },

            // ===================== 连线渲染 =====================
            // 端口的世界坐标（相对画布内容层，SVG 与节点同层变换，缩放平移时连线永不偏移）
            getSlotWorldPos(nodeId, idx, kind) {
                const el = this.nodeEl(nodeId);
                if (!el) return null;
                const slot = el.querySelector(`.node-slot[data-kind="${kind}"][data-idx="${idx}"]`);
                if (!slot) return null;
                const r = slot.getBoundingClientRect();
                const c = this.canvasContent.getBoundingClientRect();
                const s = this.transform.scale;
                return {
                    x: (r.left + r.width / 2 - c.left) / s,
                    y: (r.top + r.height / 2 - c.top) / s
                };
            },

            renderConnections() {
                let paths = '';

                this.connections.forEach(conn => {
                    const from = this.getSlotWorldPos(conn.fromNode, conn.fromSlot, 'output');
                    const to = this.getSlotWorldPos(conn.toNode, conn.toSlot, 'input');
                    if (from && to) {
                        paths += this.makePath(from.x, from.y, to.x, to.y, TYPE_COLORS[conn.type] || '#888', false);
                    }
                });

                if (this.linking && this.linkMouse) {
                    const from = this.getSlotWorldPos(this.linking.nodeId, this.linking.idx, 'output');
                    if (from) {
                        paths += this.makePath(from.x, from.y, this.linkMouse.x, this.linkMouse.y,
                            TYPE_COLORS[this.linking.dtype] || '#999', true);
                    }
                }

                this.svg.innerHTML = paths;
            },

            makePath(x1, y1, x2, y2, color, isTemp) {
                const dist = Math.abs(x2 - x1);
                const offset = Math.max(40, Math.min(dist * 0.5, 120));
                const d = `M ${x1} ${y1} C ${x1 + offset} ${y1}, ${x2 - offset} ${y2}, ${x2} ${y2}`;
                return `<path d="${d}" class="connection${isTemp ? ' temp' : ''}" stroke="${color}"/>`;
            },

            updateSlotStates() {
                this.canvasContent.querySelectorAll('.node-slot').forEach(s => s.classList.remove('connected'));
                this.connections.forEach(c => {
                    const fromEl = this.nodeEl(c.fromNode);
                    const toEl = this.nodeEl(c.toNode);
                    if (fromEl) {
                        const s = fromEl.querySelector(`.node-slot[data-kind="output"][data-idx="${c.fromSlot}"]`);
                        if (s) s.classList.add('connected');
                    }
                    if (toEl) {
                        const s = toEl.querySelector(`.node-slot[data-kind="input"][data-idx="${c.toSlot}"]`);
                        if (s) s.classList.add('connected');
                    }
                });
            },

            // ===================== 历史记录 =====================
            snapshot() {
                return {
                    nodes: JSON.parse(JSON.stringify(this.nodes)),
                    connections: JSON.parse(JSON.stringify(this.connections)),
                    nextId: this.nextId
                };
            },

            commit() {
                // 丢弃重做分支
                if (this.historyIndex < this.history.length - 1) {
                    this.history = this.history.slice(0, this.historyIndex + 1);
                }
                this.history.push(this.snapshot());
                if (this.history.length > this.maxHistory) this.history.shift();
                this.historyIndex = this.history.length - 1;
                this.updateHistoryButtons();
            },

            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    this.restoreState(this.history[this.historyIndex]);
                }
                this.updateHistoryButtons();
            },

            redo() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    this.restoreState(this.history[this.historyIndex]);
                }
                this.updateHistoryButtons();
            },

            updateHistoryButtons() {
                document.getElementById('btn-undo').classList.toggle('disabled', this.historyIndex <= 0);
                document.getElementById('btn-redo').classList.toggle('disabled', this.historyIndex >= this.history.length - 1);
            },

            restoreState(state) {
                this.nodes = JSON.parse(JSON.stringify(state.nodes));
                this.connections = JSON.parse(JSON.stringify(state.connections));
                this.nextId = state.nextId;
                this.selectedNode = null;

                this.canvasContent.querySelectorAll('.comfy-node').forEach(el => el.remove());
                this.nodes.forEach(n => this.renderNode(n));
                this.updateSlotStates();
                this.renderConnections();
            },

    validateDocument(data) {

        });

        const rawLinks=native ? data.links.map(l=>({fromNode:l[1],fromSlot:l[2],toNode:l[3],toSlot:l[4]})) : (data.connections||[]);
        const connections=array(rawLinks,'连线',10000).map(raw=>{
            if(!raw)throw Error('无效连线');
            const c={fromNode:Number(raw.fromNode),fromSlot:Number(raw.fromSlot),toNode:Number(raw.toNode),toSlot:Number(raw.toSlot)};
            const from=byId.get(c.fromNode),to=byId.get(c.toNode),out=from?.outputs[c.fromSlot],input=to?.inputs[c.toSlot];
            if(!Number.isInteger(c.fromSlot)||!Number.isInteger(c.toSlot)||!out||!input||!this.canConnect(out.type,input.type)||c.fromNode===c.toNode)throw Error('连线端口、类型或节点引用无效');
            const key=c.toNode+':'+c.toSlot;if(occupied.has(key))throw Error('一个输入端口不能连接多条线');occupied.add(key);
            return {...c,type:out.type};
        });

        const groups=array(data.groups||[],'分组',500).map((raw,i)=>{
            if(!raw)throw Error('无效分组');const id=native?i+1:Number(raw.id);
