<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI</title>
    <meta name="description" content="ComfyUI 工作流编辑：节点、分组、图像与工作流管理。">
    <style>/* STYLES */</style>
</head>
<body>
    <div id="app">
        <!-- 顶部菜单栏 -->
        <div id="topbar">
            <div class="tb-logo"><span class="logo-mark">C</span>ComfyUI</div>
            <div class="tb-sep"></div>
            <div class="tb-tab">
                <span class="dot"></span>
                <span id="workflow-name" onclick="app.renameWorkflow()" title="点击重命名工作流">未命名工作流</span>
                <span class="close" onclick="app.newWorkflow()" title="新建工作流">×</span>
            </div>
            <div class="tb-sep"></div>
            <div class="tb-btn" id="btn-undo" title="撤销 (Ctrl+Z)" onclick="app.undo()">↶</div>
            <div class="tb-btn" id="btn-redo" title="重做 (Ctrl+Shift+Z)" onclick="app.redo()">↷</div>

            <button class="tool edit-action" onclick="app.newWorkflow()">新建</button>
            <button class="tool edit-action" onclick="app.openImport()">导入 JSON</button>
            <button class="tool" onclick="app.exportWorkflow()">导出 JSON</button>
            <button class="tool" onclick="app.saveNow(true)" title="保存工作流 (Ctrl+S)">保存</button>
            <button class="tool edit-action" onclick="app.addGroupAtCenter()" title="添加背景分组 (G)">＋ 分组</button>
            <span id="save-status" role="status" aria-live="polite">正在恢复…</span>
            <div class="tb-right">
                <span class="queue-badge" id="queue-badge">队列 0</span>
                <div class="run-button" id="run-button" role="button" tabindex="0" onclick="app.isRunning ? app.stopWorkflow() : app.runWorkflow()">
                    <span id="run-icon">▶</span><span id="run-label">执行</span>
                </div>
                <button class="tb-btn tool" title="通知与执行记录" onclick="app.showNotifications()">🔔</button>
                <button class="tb-btn tool" title="设置" onclick="app.showSettings()">⚙</button>
                <button class="tool" onclick="app.showHelp()" title="操作帮助">?</button>
            </div>
        </div>

        <!-- 主体 -->
        <!-- 全局执行进度条 -->
        <div id="global-progress"><div class="gp-fill" id="gp-fill"></div></div>

        <div id="main-content">
            <!-- 左侧图标栏 -->
            <div id="side-rail">
                <div class="rail-btn active" title="工作流信息" onclick="app.showWorkflowInfo()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                </div>
                <div class="rail-btn" id="node-lib-toggle" title="节点库" onclick="app.toggleNodeLib()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                </div>
                <div class="rail-btn" title="模型库" onclick="app.showModels()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>
                </div>
                <div class="rail-btn" title="图像" onclick="app.showGallery()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                </div>
                <div class="rail-spacer"></div>
                <div class="rail-btn" id="gen-history-toggle" title="队列" style="margin-bottom: 8px;" onclick="app.toggleGenHistory()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
                </div>
            </div>

            <!-- 画布 -->
            <div id="canvas-area">
                <div id="canvas">
                    <div id="canvas-content">
                        <svg id="connections-svg"></svg>
                    </div>
                </div>

                <aside id="group-inspector" aria-label="分组设置">
                    <div class="panel-title">背景分组 <button class="tool" onclick="app.selectGroup(null)">关闭</button></div>
                    <label class="field">标签名称<input id="group-title" maxlength="200"></label>
                    <label class="field">颜色<div class="inline-fields"><input id="group-color" type="color" aria-label="选择分组颜色"><input id="group-hex" aria-label="分组颜色 HEX" placeholder="#256b89" maxlength="7"></div></label>
                    <div class="swatches" id="group-swatches"></div>
                    <label class="field">背景透明度<input id="group-opacity" type="range" min="0" max="1" step="0.01"></label>
                    <div class="two-fields">
                        <label class="field">宽度<input id="group-width" type="number" min="120" step="any"></label>
                        <label class="field">高度<input id="group-height" type="number" min="80" step="any"></label>
                    </div>
                    <label class="field">标题字号<input id="group-font" type="number" min="12" max="64" step="1"></label>
                    <label class="field"><span><input id="group-move" type="checkbox"> 移动时携带组内节点</span></label>
                    <p class="hint">拖动标题移动分组，拖动右边、底边或右下角调整尺寸。按住 Alt 拖动，仅移动背景框。</p>
                    <div class="inline-fields"><button class="tool" onclick="app.duplicateSelection()">复制分组</button><button class="tool danger" onclick="app.deleteGroup()">删除分组</button></div>
                </aside>
                <!-- 缩放控件 -->
                <div id="zoom-controls">
                    <div class="zoom-btn" title="缩小" onclick="app.zoomStep(0.8)">−</div>
                    <div id="zoom-display" title="重置缩放" onclick="app.resetView()">100%</div>
                    <div class="zoom-btn" title="放大" onclick="app.zoomStep(1.25)">+</div>
                    <div class="zoom-btn" title="适应画布" onclick="app.fitView()">⛶</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 节点搜索 -->
    <div id="search-modal">
        <input type="text" id="search-input" placeholder="搜索节点..." autocomplete="off" spellcheck="false">
        <div id="search-results"></div>
    </div>

    <!-- 下拉菜单 -->
    <div id="combo-menu"></div>

    <!-- 生成历史面板（演示用，隐藏入口） -->
    <div id="gen-history-panel">
        <div class="gh-header">
            <span>生成历史</span>
            <span class="gh-close" onclick="app.toggleGenHistory()">×</span>
        </div>
        <div class="gh-body">
            <div class="gh-upload" id="gh-upload">
                <div>点击或拖入图片</div>
                <div style="font-size:10.5px;color:#555;margin-top:3px;">支持拖放或批量导入</div>
            </div>
            <input type="file" id="gh-file-input" accept="image/*" multiple style="display:none;">
            <div class="gh-list" id="gh-list"></div>
        </div>
        <div class="gh-footer">
            <span id="gh-status">已生成 0 / 0</span>
            <span style="display:flex;gap:10px;">
                <span class="gh-reset" id="gh-back" onclick="app.stepBackGenCursor()">回退上一步</span>
                <span class="gh-reset" onclick="app.resetGenCursor()">重置进度</span>
            </span>
        </div>
    </div>

    <!-- 节点库面板 -->
    <div id="node-lib-panel">
        <div class="gh-header">
            <span>节点库</span>
            <span class="gh-close" onclick="app.toggleNodeLib()">×</span>
        </div>
        <div class="nl-load-wf" onclick="app.loadPresetWorkflow()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            <span>加载工作流：F.2-Klein9b编辑3</span>
        </div>
        <input type="text" id="nl-search" placeholder="搜索节点..." autocomplete="off" spellcheck="false">
        <div class="nl-body" id="nl-list"></div>
    </div>

    <input id="workflow-file" type="file" accept=".json,application/json" hidden>
    <dialog id="editor-dialog"><div class="panel-title"><span id="dialog-title"></span><button class="tool" onclick="document.getElementById('editor-dialog').close()">关闭</button></div><div id="dialog-body"></div></dialog>
    <!-- 提示 -->
    <div id="toast"></div>

    <script>/* APPLICATION */</script>
</body>
</html>
